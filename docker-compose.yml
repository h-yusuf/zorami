services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zora
      POSTGRES_PASSWORD: zora_dev_only
      POSTGRES_DB: zora_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
