services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zora
      POSTGRES_PASSWORD: zora_dev_only
      POSTGRES_DB: zora_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zora"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opsional - dev sehari-hari masih `uv run uvicorn ...` di host (hot-reload,
  # akses langsung ke uv/venv). Service ini buat nyoba jalan penuh lewat Docker,
  # atau nanti buat deployment. Jalankan eksplisit dengan --profile app:
  #   docker compose --profile app up -d
  app:
    profiles: ["app"]
    build: .
    env_file:
      - .env
    environment:
      # Di dalam jaringan compose, host Postgres adalah nama service "postgres",
      # bukan "localhost" - override apa pun yang ada di .env.
      ZORA_DATABASE_URL: postgresql+asyncpg://zora:zora_dev_only@postgres:5432/zora_bridge
      # .env berisi path absolut ke mesin host (.venv/bin/piper, models/...) yang
      # tidak ada di dalam container - override ke path di image (lihat Dockerfile:
      # uv sync menaruh binary Piper di /app/.venv/bin, model di-COPY ke /app/models).
      ZORA_PIPER_BINARY_PATH: /app/.venv/bin/piper
      ZORA_PIPER_MODEL_PATH: /app/models/id_ID-news_tts-medium.onnx
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
